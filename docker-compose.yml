version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: spendy_backend
    container_name: spendy_backend
    ports:
      - "3000:5000"  # 호스트 3000 → 컨테이너 5000 (FastAPI)
    volumes:
      - ./backend/uploads:/app/uploads      # 영수증 업로드 폴더 유지
      - ./backend/spendy.db:/app/spendy.db  
    networks:
      - spendy_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: spendy_frontend
    container_name: spendy_frontend
    ports:
      - "8080:80"  # 호스트 8080 → Nginx (React 정적 파일)
    depends_on:
      - backend
    networks:
      - spendy_network

networks:
  spendy_network:
    driver: bridge

